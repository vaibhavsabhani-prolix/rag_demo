services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./qdrant_storage:/qdrant/storage

    restart: unless-stopped

  # Search history database. Host port 5434 (5432 and 5433 are already in use) for local dev.
  postgres:
    image: postgres:17-alpine
    container_name: patent-search-db
    environment:
      POSTGRES_USER: patent
      POSTGRES_PASSWORD: patent
      POSTGRES_DB: patent_search
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patent -d patent_search"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Browser UI for the search history database: http://localhost:8080
  # (log in with System "PostgreSQL", user/password "patent", database "patent_search").
  adminer:
    image: adminer:latest
    container_name: patent-search-adminer
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    restart: unless-stopped

  # React UI + FastAPI search API on http://localhost:8000
  web:
    build: .
    container_name: patent-search-web
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      QDRANT_HOST: qdrant
      DATABASE_URL: postgresql+psycopg://patent:patent@postgres:5432/patent_search
    ports:
      - "8000:8000"
    volumes:
      # Hugging Face tokenizer cache, so it's downloaded only once.
      - hf_cache:/hf-cache
    restart: unless-stopped

volumes:
  hf_cache:
  pg_data:
